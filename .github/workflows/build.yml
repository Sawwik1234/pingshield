name: Build

# Собираем и тестируем плагин на каждый push и на pull request.
# Проект использует Gradle (build.gradle.kts) — Maven-шагов здесь принципиально нет.
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Gradle build + tests (JDK 25)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Minecraft/Paper 26.x собран на Java 25 — компиляция под другую версию
      # даст class-file version mismatch при запуске на сервере.
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # build = compileJava + processResources + тесты (JUnit 5) + jar.
      # Тесты ловят регрессии в математике пинга, разборе конфига и в формате
      # команд CoreProtect — без запуска настоящего сервера.
      - name: Build and test
        run: ./gradlew build --no-daemon --console=plain

      - name: Upload plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: PingShield-jar
          path: build/libs/PingShield-*.jar
          if-no-files-found: error
          retention-days: 30

      # Отчёт по тестам нужен как артефакт именно тогда, когда сборка упала:
      # иначе в логе видно только «тест не прошёл», без причины.
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/test
          if-no-files-found: ignore
          retention-days: 7

  # Настоящий сервер: скачиваем актуальный билд Folia, кладём собранный JAR,
  # поднимаем его и смотрим лог. Это ловит то, что не видит ни один юнит-тест:
  # невалидный plugin.yml, несовместимость API, падение при включении.
  smoke:
    name: Smoke test on real Folia
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Download built JAR
        uses: actions/download-artifact@v4
        with:
          name: PingShield-jar
          path: build/libs

      - name: Run smoke test
        run: |
          chmod +x ./scripts/smoke-test.sh
          ./scripts/smoke-test.sh --skip-build

      - name: Upload server log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-server-log
          path: /tmp/pingshield-smoke/console.log
          if-no-files-found: ignore
          retention-days: 7

  release:
    name: Attach JAR to release
    needs: [build, smoke]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download built JAR
        uses: actions/download-artifact@v4
        with:
          name: PingShield-jar
          path: dist

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/PingShield-*.jar
          generate_release_notes: true
