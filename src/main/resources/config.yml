  protect-immunity-only: '<yellow>⚠ Канал сильно лагает: включён щит БЕЗ заморозки — вы можете играть, но урон в обе стороны отключён.'
  protect-danger-hold: '<red>⚠ Вы в опасном месте! Защита удерживается ещё <white>%left% с</white>.'
  notify-staff: '<gray>[PingShield] <white>%player%</white> <gray>вошёл в защиту от лагов (<white>%ping% ms</white>).'
  cmd-no-permission: '<red>Недостаточно прав.'
  cmd-usage: '<gray>Использование: <white>/pingshield <reload|status|net|check|protect|unprotect|info|profile|perf|cp|search|perms|via> [игрок] [минуты] [радиус]'
  cmd-reloaded: '<green>Конфигурация перезагружена. Порог входа: <white>%enter% ms</white>, выхода: <white>%exit% ms</white>, период: <white>%interval%</white> тик(ов).'
