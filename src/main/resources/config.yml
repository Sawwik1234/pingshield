  chronic-ping-notify: '<yellow>⚠ Соединение нестабильно давно: суммарно <white>%seconds% с</white> плохого пинга за сессию (порог %total% с). Это проблема канала/провайдера — попробуйте перезайти или сменить канал.'
  chronic-ping-kick-warning: '<red>⚠ Через ~<white>%left% с</white> вы будете отключены: плохой пинг держится <white>%seconds% с</white>. Проверьте соединение!'
  chronic-ping-kick: '<red>Отключение: хронический пинг (<white>%seconds% с</white> плохого соединения из %total% с). Перезайдите — счётчик сбросится.'
