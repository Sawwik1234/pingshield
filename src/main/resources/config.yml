  cmd-net: '<gold>Сеть<gray>: медиана <white>%median% ms</white>, p90 <white>%p90% ms</white>, норма <white>%baseline% ms</white> <dark_gray>|</dark_gray> выше нормы <white>%affected%%</white> из <white>%players%</white> игроков <dark_gray>|</dark_gray> состояние: <white>%state%</white> <dark_gray>|</dark_gray> режим: <white>%mode%</white>, надбавка к порогу: <white>%bonus% ms</white> <dark_gray>|</dark_gray> скачков с старта: <white>%total%</white>'
