# PingShield — настройки защиты игроков при проблемах соединения.

# Включить PingShield.
enabled: true

# Проверка пинга и длительность защиты.
ping:
  # Порог входа, мс.
  enter-threshold-ms: 3000
  # Порог выхода, мс.
  exit-threshold-ms: 2000
  # Интервал замеров; 20 тиков = 1 с.
  check-interval-ticks: 20
  # Пауза после входа, с.
  join-grace-seconds: 15
  # Лимит защиты, с; 0 = без лимита.
  max-protection-seconds: 90
  # Пауза после достижения лимита, с.
  timeout-cooldown-seconds: 30
  # Льгота к падению после автоматического выхода в воздухе.
  fall-damage-grace-ms: 3000
  # Сглаживание пинга: от 0 до 1.
  smoothing: 0.3
  # Замеров для включения защиты.
  enter-confirm-samples: 2
  # Замеров для снятия защиты.
  exit-confirm-samples: 3
  # Минимальная длительность защиты, с.
  min-protect-seconds: 5
  # Граница шумного канала, мс.
  jitter-threshold-ms: 400
  # Надбавка за скачущий пинг, мс.
  jitter-enter-bonus-ms: 1000

# Персональные пороги по правам.
thresholds:
  # Формат: право: порог в миллисекундах.
  overrides:

# Способ заморозки и защита состояния.
freeze:
  # PASSIVE, TELEPORT или FLY.
  mode: PASSIVE
  # Включить флаг неуязвимости.
  invulnerable-flag: true
  # Поддерживать заморозку эффектом Slowness.
  potion-lock: true
  # Отключить столкновения.
  no-collision: true
  # Разрешить вертикальное движение.
  allow-vertical-movement: false
  # Не прерывать полёт на элитрах.
  keep-gliding: true
  # Предотвращать кик за полёт.
  prevent-flying-kick: true
  # Сохранять запас воздуха.
  keep-air: true
  # Сбрасывать накопление замерзания.
  clear-freeze-ticks: true
  # Сбрасывать таймер простоя.
  reset-idle-timer: true
  teleport-back:
    # Возвращать игрока к точке заморозки.
    enabled: true
    # Допустимое смещение, блоки.
    tolerance-blocks: 4.0

# Правила входящего и исходящего урона.
damage:
  incoming:
    # Блокировать весь входящий урон.
    block-all: true
    # Причины урона, которые не блокируются.
    exceptions: [VOID, WORLD_BORDER]
  outgoing:
    # Блокировать урон от игрока.
    block: true
    # Блокировать урон его питомцев.
    block-tamed-pets: true

# Запреты действий во время защиты.
interactions:
  block: true
  block-sleeping: true
  mobs-ignore-protected: true
  eject-from-vehicles: true
  block-own-inventory: true
  block-item-pickup: true
  block-teleports: true
  commands:
    # Блокировать команды.
    block: false
    # Команды, разрешённые при блокировке.
    allowed: [msg, r, tell, reply, help, pingshield, list, spawn]

# Безопасное снятие защиты.
release:
  safety:
    # Удерживать защиту в опасном месте.
    extend-in-danger: true
    # Максимальное удержание, с.
    extend-in-danger-max-seconds: 15
    # Тушить игрока при заморозке.
    extinguish-on-freeze: true
    # Возвращать запас еды.
    restore-food: true
    # Искать выход из блока перед разморозкой.
    escape-suffocation: true
    # Высота поиска выхода, блоки.
    escape-search-blocks: 8
    # Опасные блоки.
    danger-blocks: [LAVA, FIRE, SOUL_FIRE, MAGMA_BLOCK, CAMPFIRE, SOUL_CAMPFIRE, POWDER_SNOW, CACTUS]
    # Эффекты, при которых защита удерживается.
    hold-effects: [WITHER]
    # Эффекты при автоматическом выходе.
    effects: [SLOW_FALLING, FIRE_RESISTANCE]
    # Длительность эффектов, тики.
    effects-duration-ticks: 60

# Поведение защиты в бою.
combat:
  # Длительность боевого тега, с.
  tag-seconds: 8
  # Не включать защиту в бою.
  prevent-protection: false

# Ограничения против злоупотреблений.
abuse:
  # Пауза после снятия защиты, с.
  cooldown-after-end-seconds: 15
  # Максимум автозащит за час; 0 = без лимита.
  max-activations-per-hour: 8
  # LIMITED, PROTECT или IMMUNITY_ONLY.
  chronic-policy: LIMITED
  suspicious:
    # Включить оценку подозрительных активаций.
    enabled: true
    threshold: 3
    points:
      in-combat: 2
      recent-damage: 1
      recent-damage-seconds: 5
      low-health: 1
      low-health-percent: 35
      good-average-ping: 1
      good-average-ping-ms: 400
      frequent: 1
    # LOG, NOTIFY, NO_FREEZE или BLOCK.
    policy: LOG
    alert-cooldown-seconds: 120
    block-cooldown-seconds: 60
  chronic-ping:
    # Включить учёт длительного плохого пинга.
    enabled: true
    bad-ping-seconds: 600
    # Действие при хроническом пинге.
    action: NOTIFY
    kick-warning-seconds: 30
    reset-after-good-seconds: 120

# Общий всплеск пинга в подсети.
storm:
  # Включить обнаружение общего лага подсети.
  enabled: true
  # Игроков для срабатывания.
  min-players-same-subnet: 3
  # ALERT_ONLY или PAUSE_SUBNET.
  policy: ALERT_ONLY
  hold-seconds: 120
  alert-cooldown-seconds: 300
  # Подсети, которые не проверять.
  ignore-subnets: []

# Общий сетевой скачок.
network-spike:
  # Включить обнаружение общего скачка.
  enabled: true
  min-players: 20
  baseline-seconds: 60
  median-delta-ms: 120
  min-median-ms: 180
  min-ratio: 1.4
  affected-share: 0.6
  confirm-cycles: 3
  recovery-cycles: 10
  max-spike-seconds: 900
  # RAISE_THRESHOLD или SUSPEND.
  mode: RAISE_THRESHOLD
  max-threshold-bonus-ms: 1500
  alert-cooldown-seconds: 300
  suppress-player-metrics: true

# Режим работы за прокси.
proxy:
  # AUTO, ENABLE или DISABLE.
  mode: AUTO

# Подключаемые плагины.
integrations:
  coreprotect:
    # Включить CoreProtect.
    enabled: true
    markers: true
    check-on-release: true
    radius: 3
    alert-on-foreign-changes: true
    max-results: 300
    ignore-players: []
    marker-tag: 'PingShield'
    log-interaction: false
    manual-lookup-minutes: 10
  luckperms:
    # Включить LuckPerms.
    enabled: true
    threshold-meta-key: 'pingshield-threshold'
    freeze-mode-meta-key: 'pingshield-freeze-mode'
    cache-seconds: 30
  via:
    # Включить ViaVersion.
    enabled: true
    extra-threshold-ms: 500
    extra-jitter-bonus-ms: 500
    server-protocol: 0
    version-names:
      767: '1.21-1.21.1'
      769: '1.21.4'
      770: '1.21.5'

# Миры и режимы, к которым применять защиту.
limits:
  affect-creative: true
  affect-spectator: false
  # Миры, где защита отключена.
  disabled-worlds: []

# Пауза защиты при лаге сервера.
server-lag-guard:
  # Приостанавливать защиту при перегрузке сервера.
  enabled: true
  ratio: 0.75
  min-players: 4
  # Минимальный TPS для работы защиты.
  min-tps: 8.0
  resume-cycles: 3

# Интервал проверки состояния игроков.
perf:
  # Интервал повторной фиксации, тики.
  enforce-interval-ticks: 10

# Тексты и индикаторы.
messages:
  # NONE, ACTIONBAR или BOSSBAR.
  indicator: ACTIONBAR
  chat: true
  interval-seconds: 3
  prefix: '<gradient:#ffd166:#ff6b6b><bold>PingShield</bold></gradient> <dark_gray>»</dark_gray> '
  protect-start: '<yellow>⚠ Ваш пинг <white>%ping% ms</white> — вы временно защищены. Движение, урон и взаимодействия отключены до стабилизации соединения.'
  protect-actionbar: '<yellow>⚠ Защита от лагов: <white>%ping% ms</white> <dark_gray>|</dark_gray> <gray>%elapsed% с'
  protect-boss-bar: '<yellow>Защита от лагов: <white>%ping% ms</white> <dark_gray>|</dark_gray> <gray>%elapsed% с</gray>'
  protect-end: '<green>✔ Пинг в норме (<white>%ping% ms</white>) — защита снята, всё снова работает.'
