  cmd-perms-node: '<gray>• <white>%node%</white> — <white>%value%</white>'
  cmd-perms-luckperms: '<gray>LuckPerms: <white>%details%</white>'
  cmd-perms-unavailable: '<gray>LuckPerms не установлен или выключен в конфиге: пороги берутся из thresholds.overrides и общего значения.'
