  cmd-info: '<gold>PingShield <white>v%version%</white> <dark_gray>|</dark_gray> включён: %enabled% <dark_gray>|</dark_gray> %enter%/%exit% ms <dark_gray>|</dark_gray> заморозка: %freeze% <dark_gray>|</dark_gray> индикатор: %indicator% <dark_gray>|</dark_gray> лимит: %max% с <dark_gray>|</dark_gray> прокси: %proxy% (режим %proxyMode%) <dark_gray>|</dark_gray> журнал: %audit% <dark_gray>|</dark_gray> CoreProtect: %coreprotect% <dark_gray>|</dark_gray> Via: %via% <dark_gray>|</dark_gray> Folia: %folia%'

# Журналирование.
logging:
  # Вести журнал событий.
  audit-log: true
  file: audit.log
