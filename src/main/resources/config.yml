# ==========================================================================================
#  PingShield — защита игроков с очень высоким пингом
#  Paper / Purpur / Folia 26.1.x   ·   автор: Sawwik
# ==========================================================================================
#  Проблема: при пинге 3000+ ms клиент игрока продолжает двигаться локально, а сервер видит
#  устаревшую позицию и продолжает считать урон. Игрок умирает от мобов, падает в лаву,
#  получает удары в PvP, которых даже не видел.
#
#  Решение: пока пинг выше порога, игрок «заморожен» — не двигается, не взаимодействует
#  с миром и не наносит урон, а входящий урон по нему отключён. Когда пинг в норме,
#  всё включается обратно, с «мягкой посадкой» (эффекты + льгота на урон от падения).
#
#  ВАЖНО про честность: защита НЕ даёт преимущества. Нет входящего урона — нет и исходящего,
#  плюс лимит времени и счётчик срабатываний, чтобы «лаговый щит» нельзя было включить вечно.
# ==========================================================================================

enabled: true

# ------------------------------------------------------------------------------------------
#  ПОРОГИ ПИНГА
# ------------------------------------------------------------------------------------------
ping:
  # Пинг >= этого значения включает защиту (мс).
  enter-threshold-ms: 3000
  # Пинг <= этого значения снимает защиту. ОБЯЗАТЕЛЬНО меньше порога входа — это гистерезис.
  # Без него защита будет мигать несколько раз в секунду при пинге «на грани».
  exit-threshold-ms: 2000
  # Как часто опрашивать пинг (тики; 20 тиков = 1 сек). Меньше 10 ставить бессмысленно:
  # пинг меняется медленнее, а нагрузка растёт.
  check-interval-ticks: 20
  # «Льготный» период после входа на сервер (сек): первые секунды пинг ещё не измерен
  # корректно, защита не включается — иначе игрок замирает прямо на спавне.
  join-grace-seconds: 15
  # Максимальная длительность одной защиты (сек). 0 = без ограничения (НЕ рекомендуется:
  # это даёт способ получить вечное бессмертие искусственным лагом).
  max-protection-seconds: 90
  # Пауза после срабатывания лимита выше, в течение которой защита не включается (сек).
  timeout-cooldown-seconds: 30
  # Сколько мс после снятия защиты не работает урон от падения, если игрок отпущен в воздухе.
  # Если защита снята на земле, будущий прыжок/падение этой льготой не покрывается.
  fall-damage-grace-ms: 3000

  # ----------------------------------------------------------------------------------------
  #  СГЛАЖИВАНИЕ И ПОДТВЕРЖДЕНИЯ — ответ на «у игрока плохой провайдер, пинг скачет всегда»
  # ----------------------------------------------------------------------------------------
  # Вес нового замера в сглаженном пинге (EWMA). 0.3 = реакция ~за 3-5 замеров.
  # Меньше — плавнее (менее чувствительно к одиночным спайкам), больше — резче.
  smoothing: 0.3
  # Сколько замеров ПОДРЯД пинг должен быть выше порога, чтобы включить защиту.
  # 2 при периоде 20 тиков = ~2 секунды стабильно плохого пинга.
  enter-confirm-samples: 2
  # Сколько замеров ПОДРЯД пинг должен держаться ниже порога выхода, чтобы снять защиту.
  # Именно это гасит «мигание» заморозки при скачущем соединении.
  exit-confirm-samples: 3
  # Минимальное время одной защиты (сек): быстрее этого срока она не снимется, даже если
  # один замер оказался хорошим. Убирает частые заморозка/разморозка.
  min-protect-seconds: 5
  # Если сглаженное отклонение пинга (jitter) выше этого значения, канал считается «шумным»
  # и порог входа поднимается на jitter-enter-bonus-ms: обычные скачки не морозят игрока.
  jitter-threshold-ms: 400
  jitter-enter-bonus-ms: 1000

# Индивидуальные пороги по правам. Первое совпавшее право выигрывает.
# Удобно для мобильного/спутникового интернета: у таких игроков пинг «плохой» постоянно.
thresholds:
  overrides:
    # pingshield.limit.5000: 5000
    # pingshield.limit.mobile: 4500

# ------------------------------------------------------------------------------------------
#  ЗАМОРОЗКА
# ------------------------------------------------------------------------------------------
freeze:
  # ВАЖНО: ни один режим не меняет GameMode. Никакого GM1/креатива — игрок остаётся в своём
  # режиме игры, а бессмертие даёт флаг неуязвимости (freeze.invulnerable-flag).
  #
  # PASSIVE  — (по умолчанию) игрок «застыл»: движение отменяется, скорость ходьбы обнуляется,
  #            позиция удерживается возвратом на якорь. Без полёта, не похоже на GM1.
  # TELEPORT — самый «тихий» режим: ничего не меняем вообще, только отмена движения и возврат.
  # FLY      — вешает игрока в воздухе через полёт. Самый заметный вариант, античиты могут
  #            пометить «Fly»; включайте только если PASSIVE вам не подходит.
  mode: PASSIVE
  # Настоящее «бессмертие»: флаг неуязвимости сущности. Работает в любом GameMode и на уровне
  # сервера, а не только отменой событий. Обходят его лишь пустота и /kill — это список
  # damage.incoming.exceptions ниже.
  invulnerable-flag: true
  # Дополнительный слой фиксации: Slowness 250 на время защиты. Нужен, если другой плагин
  # сбросит walk-speed. Эффект снимается при разморозке (только если его поставил PingShield).
  potion-lock: true
  # Не давать мобам и другим игрокам толкать/выталкивать замороженного игрока.
  no-collision: true
  # Разрешить вертикальное движение (игрок медленно падает, а не висит). По умолчанию выключено:
  # полная заморозка безопаснее, т.к. урон от падения при снятии защиты всё равно перекрыт.
  allow-vertical-movement: false
  #
  # --- ЭЛИТРЫ И ПАДЕНИЕ: читайте перед изменением ---
  # Сервер (Folia/Paper) каждый тик проверяет, не «висит» ли игрок в воздухе без права полёта,
  # и через 80 тиков (4 секунды) отключает его с сообщением
  # «Flying is not enabled on this server» (причина FLYING_PLAYER).
  # Замороженный игрок висит по определению, поэтому плагин делает две вещи:
  #
  # keep-gliding — при заморозке НЕ сворачивать элитры. Игрок остаётся в глайде (серверная проверка
  #   для него отключена самим флагом глайда), не теряет высоту и после разморозки продолжает
  #   планировать, а не падает. Раньше элитры сворачивались — это и приводило к кику через 4 секунды.
  keep-gliding: true
  # prevent-flying-kick — страховка. Пока игрок под защитой, плагин держит mayfly
  #   (Player#setAllowFlight): это не меняет игровой режим и не выглядит как креатив, полёт по факту
  #   недоступен — движение отменяется, а двойной пробел (PlayerToggleFlightEvent) блокируется.
  #   На разморозке значение возвращается как было. Плюс: если сервер всё же попытается отключить
  #   игрока за зависание, плагин отменяет сам кик (FLYING_PLAYER / FLYING_VEHICLE) и пишет об этом
  #   в audit.log строкой FLYING_KICK_PREVENTED.
  prevent-flying-kick: true
  #
  # keep-air — пока игрок заморожен, держать запас воздуха полным, а при разморозке вернуть его.
  # Замороженный под водой игрок не может всплыть: без этой настройки у него пустеют пузырьки,
  # играет звук захлёбывания, а после снятия защиты он всплывает уже мёртвым. Урон от удушья
  # отменяется и так, но «защита убила меня» — не то, что нужно.
  keep-air: true
  #
  # clear-freeze-ticks — сбрасывать накопленное замерзание (порошковый снег). Стоя в порошковом
  # снеге, игрок набирает freeze-тики: урон при этом отменяется, но накопленное замерзание
  # осталось бы и ударило в первую же секунду после снятия защиты.
  clear-freeze-ticks: true
  #
  # reset-idle-timer — сбрасывать таймер простоя, пока игрок заморожен. Замороженный игрок не
  # может двигаться, и на сервере с включённым playerIdleTimeout его отключило бы с «idling».
  reset-idle-timer: true
  # Страховка от пистонов, взрывов и чужих плагинов: если игрока сдвинуло — вернуть назад
  # через teleportAsync (на Folia обычный teleport() запрещён).
  teleport-back:
    enabled: true
    # Насколько далеко игрок должен уйти от точки удержания, чтобы это считалось сдвигом.
    tolerance-blocks: 4.0

# ------------------------------------------------------------------------------------------
#  УРОН
# ------------------------------------------------------------------------------------------
damage:
  incoming:
    # Полный иммунитет: PvP, мобы, падение, лава, взрывы, снаряды, магия, удушье и т.д.
    block-all: true
    # Исключения: этот урон ПРОХОДИТ даже сквозь защиту.
    # Держите VOID и WORLD_BORDER, иначе игрок может «застрять» в пустоте бессмертным
    # (до срабатывания max-protection-seconds). Причины: org.bukkit.event.entity.EntityDamageEvent.DamageCause
    exceptions: [VOID, WORLD_BORDER]
  outgoing:
    # Замороженный игрок не наносит урон. Без этого высокий пинг = безнаказанные удары.
    block: true
    # Питомцы замороженного (волки, кошки, големы) тоже не бьют.
    block-tamed-pets: true

# ------------------------------------------------------------------------------------------
#  ВЗАИМОДЕЙСТВИЯ
# ------------------------------------------------------------------------------------------
interactions:
  # Ломать/ставить блоки, кликать предметами, открывать контейнеры, кидать вещи, лить вёдра,
  # есть, менять предметы местами, брать книги с кафедры, доить коров и т.д.
  block: true
  # Не давать спать в кровати (иначе клиент и сервер расходятся в состоянии сна).
  block-sleeping: true
  # Мобы перестают выбирать замороженного игрока целью.
  mobs-ignore-protected: true
  # Высаживать из лодки/лошади/вагонетки: иначе транспорт продолжает ехать и тащит игрока.
  eject-from-vehicles: true
  # «Не может сделать НИЧЕГО»: запрещаем даже открывать собственный инвентарь.
  block-own-inventory: true
  # Не давать подбирать предметы (в т.ч. выпавшие до заморозки).
  # Подбор предметов замороженным (1.6.4: настройка действительно работает — до этого она
  # читалась из конфига, но не применялась).
  block-item-pickup: true
  # Блокировать любые телепорты: порталы, эндер-жемчуг, /tp от других плагинов.
  # Наш собственный возврат на якорь работает всегда.
  block-teleports: true
  commands:
    # Блокировать ли команды. По умолчанию НЕТ: замороженный игрок должен смочь написать
    # /msg, /help или позвать администратора. Если включить — работает белый список ниже.
    block: false
    allowed: [msg, r, tell, reply, help, pingshield, list, spawn]

# ------------------------------------------------------------------------------------------
#  БЕЗОПАСНОЕ СНЯТИЕ ЗАЩИТЫ
# ------------------------------------------------------------------------------------------
release:
  safety:
    # Пинг уже в норме, но игрок стоит в лаве/огне/пустоте. Отпустить сейчас — мгновенная смерть
    # без шанса среагировать. Держим до N секунд, затем всё равно отпускаем.
    extend-in-danger: true
    extend-in-danger-max-seconds: 15
    # Тушить огонь при входе в защиту: игрок не должен «сгореть» из-за лага.
    # Если после разморозки он снова окажется в лаве/огне — удержание в опасном месте не даст ему умереть.
    extinguish-on-freeze: true
    # Вернуть сытость/насыщение, которые успели упасть за время заморозки
    # (в защите нельзя есть, поэтому честно вернуть ресурс обратно).
    restore-food: true
    # Удушье в блоке: пока защита держит, засыпанный песком/гравием (или замурованный) игрок
    # не получает урона, но в момент снятия защиты начинает задыхаться и умирает — выкопаться
    # он не может. Поэтому перед разморозкой плагин ищет свободное место в той же колонке вверх
    # и поднимает игрока туда. Если места нет — защита удерживается (до max-protection-seconds).
    escape-suffocation: true
    # На сколько блоков вверх искать это свободное место (1..64).
    escape-search-blocks: 8
    # Что считается опасным местом (id блоков; плюс огонь на игроке, падение > 8 блоков,
    # кончающийся воздух под водой, опасные эффекты из hold-effects и низ мира).
    danger-blocks: [LAVA, FIRE, SOUL_FIRE, MAGMA_BLOCK, CAMPFIRE, SOUL_CAMPFIRE, POWDER_SNOW, CACTUS]
    # Опасные эффекты: пока на игроке любой из них, защита не снимается (в пределах
    # extend-in-danger-max-seconds) — иначе накопленный эффект ударит сразу после разморозки.
    # Урон от этих эффектов во время защиты и так отменяется; здесь речь именно про момент снятия.
    # POISON в ваниле не убивает (оставляет полсердца), поэтому по умолчанию только WITHER.
    hold-effects: [WITHER]
    # Эффекты «мягкой посадки» при снятии защиты (и во время удержания в опасности):
    # дают шанс отреагировать, если игрок выпал в воздухе над лавой или горит.
    # SLOW_FALLING применяется только когда игрок отпускается в воздухе.
    effects: [SLOW_FALLING, FIRE_RESISTANCE]
    effects-duration-ticks: 60

# ------------------------------------------------------------------------------------------
#  БОЙ (античит-режим для PvP-серверов)
# ------------------------------------------------------------------------------------------
combat:
  # Сколько секунд после удара (своего или по себе) считается, что игрок в бою.
  tag-seconds: 8
  # true — во время боя защита НЕ включается вообще. Это убирает возможность «убежать
  # рывком лага» в PvP, но игроки будут умирать от лагов в бою. Выбирайте осознанно.
  prevent-protection: false

# ------------------------------------------------------------------------------------------
#  АНТИ-АБУЗ (нельзя превратить защиту в чит)
# ------------------------------------------------------------------------------------------
abuse:
  # Пауза после любого снятия защиты (кроме выхода из игры), сек.
  cooldown-after-end-seconds: 15
  # Сколько раз за час игрок может попасть под автозащиту. 0 = без лимита.
  max-activations-per-hour: 8
  # Что делать, когда игрок упёрся в лимит выше (то есть лагает постоянно):
  #   LIMITED       — защита не включается, игрок получает предупреждение (строгий вариант);
  #   PROTECT       — защищать всегда, лимит игнорируется (мягкий вариант);
  #   IMMUNITY_ONLY — «щит без заморозки»: игрок играет как обычно, но урон в обе стороны
  #                   не проходит. Компромисс для плохого провайдера: не морозим, но и не
  #                   даём преимущества (урон от него тоже выключен).
  chronic-policy: LIMITED

  # ---------------------------------------------------------------------------------------
  #  ДЕТЕКТ «ИСКУССТВЕННОГО ЛАГА» (абуз защитой)
  # ---------------------------------------------------------------------------------------
  #  Идея: настоящий лаг приходит ВНЕЗАПНО и не зависит от того, что происходит в игре.
  #  Игрок, который «вспоминает» про лаг ровно в тот момент, когда ему это выгодно
  #  (его ударили, он на 3 хп, бой идёт), — повод присмотреться. Проверка стоит один
  #  счётчик на активацию: считаем баллы только в момент входа в защиту, а не каждый тик.
  #
  #  ВАЖНО: по умолчанию политика LOG — защита выдаётся как обычно, а факт просто попадает
  #  в audit.log. Так «честный» игрок с плохим провайдером не страдает от ложных
  #  срабатываний, а админ может сначала посмотреть статистику и только потом включить
  #  NO_FREEZE/BLOCK.
  suspicious:
    enabled: true
    # Баллы, при которых активация считается подозрительной.
    threshold: 3
    points:
      # Активация в бою (combat.tag-seconds выше): классический «ударь меня — я в лаге».
      in-combat: 2
      # Игрок получил урон за последние N секунд — заморозка сразу после удара выгодна.
      recent-damage: 1
      recent-damage-seconds: 5
      # Активация на низком здоровье: «заморозился, чтобы не убили».
      low-health: 1
      low-health-percent: 35
      # Обычный (базовый) пинг игрока хороший, а сейчас «внезапно» 3000+ ms.
      good-average-ping: 1
      good-average-ping-ms: 400
      # Игрок уже часто активировал защиту в этом часе (см. max-activations-per-hour).
      frequent: 1
    # LOG           — только запись в audit.log (рекомендуется по умолчанию);
    # NOTIFY        — плюс уведомление персоналу (pingshield.notify), защита выдаётся;
    # NO_FREEZE     — защита выдаётся как «щит без заморозки»: играть можно, но урон
    #                 в обе стороны выключен — преимущества в PvP нет;
    # BLOCK         — защита не выдаётся совсем (жёстко: честный игрок с ложным
    #                 срабатыванием останется без защиты; включайте осознанно).
    policy: LOG
    # Не чаще одного уведомления/записи на игрока, сек.
    alert-cooldown-seconds: 120
    # Сколько держать «паузу» после BLOCK, сек.
    block-cooldown-seconds: 60

  # ---------------------------------------------------------------------------------------
  #  ХРОНИЧЕСКИЙ ПИНГ (политика для тех, у кого плохо ВСЕГДА)
  # ---------------------------------------------------------------------------------------
  #  Считаем не момент, а СУММУ: сколько секунд плохого соединения игрок набрал за сессию.
  #  Счётчик затухает, когда пинг в норме, и полностью сбрасывается после
  #  reset-after-good-seconds стабильно хорошего пинга.
  #
  #  Даёт понять разницу между «упал провайдер сейчас» и «этот игрок физически не может
  #  играть из-за канала». Действия намеренно мягкие: по умолчанию только уведомление.
  chronic-ping:
    enabled: true
    # Сколько суммарных секунд плохого пинга считать «хроническим».
    bad-ping-seconds: 600
    # NONE          — ничего не делать;
    # NOTIFY        — сообщить игроку (и всё, защита работает как обычно) — рекомендовано;
    # IMMUNITY_ONLY — дальше только «щит без заморозки»: игрока не морозим, но урон не проходит
    #                 (в обе стороны). Щит включается так же, как обычная защита — в момент,
    #                 когда пинг переходит порог входа; в остальное время игрок играет как обычно;
    # KICK          — предупредить и отключить от сервера (для хардкорного PvP-сервера).
    action: NOTIFY
    # За сколько секунд до KICK предупредить игрока (только для action: KICK).
    kick-warning-seconds: 30
    # Сброс счётчика после стольких секунд хорошего соединения подряд.
    reset-after-good-seconds: 120

# ------------------------------------------------------------------------------------------
#  ПИНГОВЫЙ ШТОРМ ПО ПОДСЕТЯМ
# ------------------------------------------------------------------------------------------
#  Если одновременно лагают НЕСКОЛЬКО игроков из одной подсети (IPv4 → /24, IPv6 → /64),
#  это почти всегда проблема канала/провайдера или сетевая атака, а не «выпрошенный» лаг:
#  один игрок не может уронить канал у соседей. PingShield группирует игроков по подсетям
#  (снимок при входе, кэш) и сравнивает «сырой» пинг с порогом входа.
#
#  Ложные срабатывания дешёвы: в худшем случае админы получат лишнее уведомление.
storm:
  enabled: true
  # Со скольких игроков одной подсети одновременно считать это штормом.
  min-players-same-subnet: 3
  # ALERT_ONLY   — только уведомить персонал (защита продолжает работать: людям с реально
  #               плохим каналом она нужна) — рекомендовано;
  # PAUSE_SUBNET — приостановить НОВЫЕ защиты (и снять текущие) у игроков этой подсети
  #               на hold-seconds: если канал лёг у всех, замораживать пол-сервера вредно;
  # PAUSE_ALL    — то же самое, но для всего онлайна (для софт-атак через много подсетей).
  policy: ALERT_ONLY
  # Сколько держать паузу после шторма, сек (для PAUSE_*).
  hold-seconds: 120
  # Не чаще одного уведомления о шторме, сек.
  alert-cooldown-seconds: 300
  # Подсети-исключения (свои VPN/прокси-узлы, известные «шумные» сети). Формат как в выводе:
  #   203.0.113.0/24, 2001:db8:1234::/64
  ignore-subnets: []

# ------------------------------------------------------------------------------------------
#  ОБЩИЙ СЕТЕВОЙ СКАЧОК
# ------------------------------------------------------------------------------------------
#  Случай, который нельзя путать с личным лагом: пинг поднялся СРАЗУ У ВСЕХ (например
#  с 60 до 200-400 ms) — упал магистральный канал, проблемы у хостера, сетевая атака
#  на аплинк. Замораживать весь онлайн в такой момент бессмысленно и опасно: 500 заморозок
#  — это 500 задач удержания и телепортов ровно тогда, когда сервер и так задыхается.
#
#  Как распознаётся: пинг всех игроков за цикл раскладывается в гистограмму (корзины по
#  25 ms), из неё берётся МЕДИАНА (устойчива к одному лагающему — в отличие от среднего)
#  и сравнивается с «нормой» — медленным EWMA медианы. Скачком считается ситуация, когда
#  одновременно: медиана выросла на median-delta-ms, поднялась выше min-median-ms,
#  выросла не меньше чем в min-ratio раз и «выше нормы» оказалось affected-share игроков.
#  Всё это должно держаться confirm-cycles циклов подряд.
network-spike:
  enabled: true
  # Минимум игроков с валидным пингом, иначе статистика недостоверна (лобби в 5 человек).
  min-players: 20
  # За сколько секунд усредняется «нормальный» уровень сети (медленное EWMA медианы).
  baseline-seconds: 60
  # Насколько должна вырасти медиана, мс.
  median-delta-ms: 120
  # ...и какой минимум она должна показывать (скачок «от 200 пинга»).
  min-median-ms: 180
  # ...и во сколько раз вырасти относительно нормы.
  min-ratio: 1.4
  # Какая доля игроков должна оказаться «выше нормы» — чтобы это был скачок у ВСЕХ,
  # а не у пары человек (0.6 = 60 %).
  affected-share: 0.6
  # Подтверждение и гистерезис: циклов подряд для старта / спокойных циклов для закрытия.
  confirm-cycles: 3
  recovery-cycles: 10
  # Сколько секунд скачок может длиться, прежде чем он станет «новой нормой» канала.
  # Если провайдер сменил маршрут и пинг остался выше НАВСЕГДА — это уже не авария,
  # и защита должна считать нормой новый уровень, а не жить в режиме скачка вечно.
  max-spike-seconds: 900
  # ALERT_ONLY      — только уведомить персонал, защиты работают как обычно;
  # RAISE_THRESHOLD — (рекомендуется) временно поднять порог входа на величину скачка:
  #                   личный лаг всё ещё защищается, а общий подъём сети не превращается
  #                   в массовую заморозку;
  # SUSPEND         — не включать НОВЫЕ защиты на время скачка (текущие остаются: снимать
  #                   заморозку в момент сетевой аварии = отдавать игроков на смерть).
  mode: RAISE_THRESHOLD
  # Потолок надбавки к порогу, мс (чтобы скачок не «съел» порог совсем).
  max-threshold-bonus-ms: 1500
  # Не чаще одного уведомления о скачке, сек.
  alert-cooldown-seconds: 300
  # Не копить секунды хронического пинга и баллы «искусственного лага», пока виноват
  # аплинк, а не игрок. Строго рекомендуется true.
  suppress-player-metrics: true

# ------------------------------------------------------------------------------------------
#  ПРОКСИ (Velocity / BungeeCord)
# ------------------------------------------------------------------------------------------
# За прокси getPing() измеряет путь «прокси ↔ этот сервер», а не «игрок ↔ прокси».
# Реальный лаг игрока на линии виден только на прокси (или в плагине на прокси через
# Player#getPing у Velocity), поэтому автозащита по пингу за прокси бессмысленна.
proxy:
  # AUTO    — если обнаружен локальный вход (127.0.0.1), автозащита отключается.
  # ENABLE  — работать как обычно (осознанно, если пинг до прокси всё же отражает проблему).
  # DISABLE — не проверять пинг вообще, оставить только ручные команды.
  mode: AUTO

# ------------------------------------------------------------------------------------------
#  ИНТЕГРАЦИИ
# ------------------------------------------------------------------------------------------
integrations:
  # ---------------------------------------------------------------------------------------
  #  CoreProtect (soft-depend: работает, если плагин установлен и его API включён)
  # ---------------------------------------------------------------------------------------
  #  Зачем: CoreProtect знает, КТО и КОГДА менял блоки. Пока игрок стоит замороженным,
  #  он не видит и не может реагировать — это классический момент для грифa: под ним
  #  копают, его застраивают, ломают дверь «в лаге». PingShield читает логи CoreProtect:
  #    1) пишет маркеры «защита ВКЛ/ВЫКЛ» в лог (видны в /co lookup как сообщения игрока);
  #    2) при снятии защиты одним запросом получает изменения вокруг игрока за время защиты,
  #       пишет сводку в audit.log и уведомляет персонал с готовой командой /co lookup.
  coreprotect:
    enabled: true
    # Писать маркеры защиты в лог CoreProtect (через API#logChat).
    # Видны в /co lookup по зоне/времени — администратор понимает, почему игрок «стоял столбом».
    markers: true
    # Проверять изменения вокруг игрока при снятии защиты.
    check-on-release: true
    # Радиус проверки в блоках (куб: 3 -> 7x7x7 = 343 блока). 0 = только блок под игроком.
    # Чем больше радиус, тем дороже один запрос к базе CoreProtect (запрос асинхронный).
    radius: 3
    # Уведомлять персонал (право pingshield.notify), если вокруг замороженного игрока
    # что-то меняли ДРУГИЕ игроки.
    alert-on-foreign-changes: true
    # Максимум записей в одном ответе CoreProtect.
    max-results: 300
    # Игроки, изменения которых не считаются подозрительными (например, ваш админ-бот).
    ignore-players: []

    # ------------------------------------------------------------------------------------
    #  ВСТРАИВАНИЕ ПОИСКА В COREPROTECT
    # ------------------------------------------------------------------------------------
    #  CoreProtect не даёт добавить свой тип данных (схема базы фиксирована), но умеет
    #  фильтровать ТЕКСТ по префиксу — параметр f: у /co lookup. Поэтому события PingShield
    #  пишутся маркерами вида:
    #      [PingShield/START] защита от лагов ВКЛ: пинг 4210 ms (порог 3500 ms)
    #      [PingShield/END]   защита ВЫКЛ: PING_OK, длительность 42 с
    #      [PingShield/HOLD]  удержание: опасное место, осталось 9 с
    #      [PingShield/CP]    рядом меняли блоки: Alex (12)
    #  и ищутся РОДНЫМИ командами CoreProtect:
    #      /co lookup a:chat f:[PingShield] t:1h            — все события PingShield за час
    #      /co lookup a:chat f:[PingShield/START] t:1d      — только входы в защиту
    #      /co lookup u:Steve a:chat f:[PingShield] t:6h    — события одного игрока
    #      /co lookup a:chat f:[PingShield] t:2h #count     — только количество
    #  Тег можно переименовать (без пробелов и запятых — запятая разделяет префиксы в f:).
    marker-tag: 'PingShield'

    # Дополнительно писать запись взаимодействия в точке удержания (CoreProtect logInteraction).
    # Тогда защищённые игроки видны и в географическом поиске: /co lookup a:click r:10 t:2h.
    # Минус: +2 строки в базе CoreProtect на каждую защиту. По умолчанию выключено.
    log-interaction: false
    # Сколько минут смотреть по команде /pingshield cp <игрок> без параметров.
    manual-lookup-minutes: 10

  # ---------------------------------------------------------------------------------------
  #  LuckPerms (soft-depend)
  # ---------------------------------------------------------------------------------------
  #  Персональные пороги и режимы задаются ПРАВАМИ И META LuckPerms — без правки конфига
  #  сервера. Порядок приоритетов:
  #      meta → право pingshield.threshold.<мс> → thresholds.overrides → общий порог
  #
  #  Примеры (выполняются в игре или в консоли):
  #      /lp group mobile permission set pingshield.threshold.4000 true     — группе порог 4000 ms
  #      /lp user Steve  permission set pingshield.threshold.2500 true      — конкретному игроку 2500 ms
  #      /lp user Steve  meta set pingshield-threshold 4500                 — то же через meta
  #      /lp user Steve  meta set pingshield-freeze-mode immunity_only      — щит без заморозки
  #      /lp user Steve  permission set pingshield.bypass true world=arena  — обход только на арене
  #
  #  Если прав-порогов у игрока несколько (например, от двух групп), берётся САМЫЙ СТРОГИЙ
  #  (наименьший) — случайно ослабить защиту нельзя.
  luckperms:
    enabled: true
    # Ключ meta с числовым порогом (мс). Приоритет выше прав.
    threshold-meta-key: 'pingshield-threshold'
    # Ключ meta с режимом заморозки: passive | teleport | fly | immunity_only | default.
    freeze-mode-meta-key: 'pingshield-freeze-mode'
    # Как долго кэшировать прочитанные значения (сек). 0 = читать при каждой проверке.
    # Кэш автоматически сбрасывается событием LuckPerms при изменении прав игрока.
    cache-seconds: 30

  # ---------------------------------------------------------------------------------------
  #  ViaVersion / ViaBackwards (soft-depend)
  # ---------------------------------------------------------------------------------------
  #  На ядре 26.1.2 клиенты 1.21.4 и ниже — это СТАРЫЕ клиенты на новом сервере: их пускает
  #  ViaBackwards (ViaVersion сам по себе пускает только клиенты НОВЕЕ ядра, напр. 26.2/26.3).
  #
  #  Player#getPing() Via не искажает: это по-прежнему реальный RTT до клиента, так что вся
  #  логика работает. Но трансляция протокола добавляет серверу работы и повышает ДЖИТТЕР,
  #  поэтому для таких клиентов порог входа поднимается — иначе их будет «морозить»
  #  на обычных для них скачках.
  via:
    enabled: true
    # Надбавка к порогу входа для клиентов с трансляцией протокола (мс).
    extra-threshold-ms: 500
    # Дополнительная надбавка к «порогу шума» (jitter) для них же.
    extra-jitter-bonus-ms: 500
    # Протокол вашего ядра. 0 = определить автоматически (через публичный UnsafeValues).
    # Если автоопределение не сработало, укажите число вручную — его видно в /pingshield via.
    server-protocol: 0
    # Человекочитаемые имена протоколов (необязательно, для красоты в /pingshield via и /profile).
    # Номера протоколов: 767 = 1.21-1.21.1, 769 = 1.21.4, 770 = 1.21.5.
    version-names:
      767: '1.21-1.21.1'
      769: '1.21.4'
      770: '1.21.5'

# ------------------------------------------------------------------------------------------
#  ЛИМИТЫ И МИРЫ
# ------------------------------------------------------------------------------------------
limits:
  affect-creative: true
  affect-spectator: false
  # Миры, где защита не работает (пусто = везде). Например арены с собственными правилами.
  disabled-worlds: []

# ------------------------------------------------------------------------------------------
#  ЗАЩИТА ОТ СЕРВЕРНОГО ЛАГА
# ------------------------------------------------------------------------------------------
# Если лагает не игрок, а сам сервер, пинг подскакивает у ВСЕХ сразу. Без этой проверки
# весь онлайн превратился бы в «статуи» и получил бессмертие.
server-lag-guard:
  enabled: true
  # Доля игроков с высоким пингом, при которой считаем, что проблема на сервере.
  ratio: 0.75
  # Минимум онлайна для этой проверки (при 1 игроке серверный лаг неотличим от клиентского).
  min-players: 4
  # Если TPS опустился ниже — тоже считаем серверным лагом (0 = не проверять TPS).
  min-tps: 8.0
  # Сколько подряд «здоровых» проверок нужно, чтобы вернуть автозащиту (защита от мигания).
  resume-cycles: 3

# ------------------------------------------------------------------------------------------
#  ПРОИЗВОДИТЕЛЬНОСТЬ
# ------------------------------------------------------------------------------------------
perf:
  # Как часто перепроверять состояние защищённого игрока (тики). Заморозка и индикатор
  # не требуют 20 Гц: 10 тиков = 2 раза в секунду. Движение всё равно контролируется
  # событием PlayerMoveEvent, поэтому «убежать» игрок не может.
  enforce-interval-ticks: 10

# ------------------------------------------------------------------------------------------
#  СООБЩЕНИЯ
# ------------------------------------------------------------------------------------------
# Поддерживается MiniMessage (<gold>, <#ff8800>, <bold>) и классические &c-коды.
# Плейсхолдеры: %player% %ping% %peak% %elapsed% %enter% %exit% %max% %limit% %left% %world%
messages:
  # ACTIONBAR | BOSS_BAR | BOTH | NONE
  # Почему есть вариант BOSS_BAR: при пинге 3000+ ms сообщения в чат/actionbar приходят
  # с задержкой и могут «схлопнуться». Полоса босса висит, пока защита активна, и требует
  # одного пакета. Внимание: BossBar перекрывает ванильные полосы боссов (Иссушитель, дракон).
  indicator: ACTIONBAR
  # Писать ли вход/выход из защиты в чат (не только в actionbar/боссбар).
  chat: true
  # Как часто обновлять индикатор (сек).
  interval-seconds: 3
  prefix: '<gradient:#ffd166:#ff6b6b><bold>PingShield</bold></gradient> <dark_gray>»</dark_gray> '
  protect-start: '<yellow>⚠ Ваш пинг <white>%ping% ms</white> — вы временно защищены. Движение, урон и взаимодействия отключены до стабилизации соединения.'
  protect-actionbar: '<yellow>⚠ Защита от лагов: <white>%ping% ms</white> <dark_gray>|</dark_gray> <gray>%elapsed% с'
  protect-boss-bar: '<yellow>Защита от лагов: <white>%ping% ms</white> <dark_gray>|</dark_gray> <gray>%elapsed% с</gray>'
  protect-end: '<green>✔ Пинг в норме (<white>%ping% ms</white>) — защита снята, всё снова работает.'
  protect-timeout: '<red>✖ Защита снята: превышен лимит %max% с. Проверьте соединение!'
  protect-limit-reached: '<red>Лимит защит (%limit% в час) исчерпан — соединение слишком нестабильно. Режим: %policy% (см. /pingshield profile).'
  protect-immunity-only: '<yellow>⚠ Канал сильно лагает: включён щит БЕЗ заморозки — вы можете играть, но урон в обе стороны отключён.'
  protect-danger-hold: '<red>⚠ Вы в опасном месте! Защита удерживается ещё <white>%left% с</white>.'
  notify-staff: '<gray>[PingShield] <white>%player%</white> <gray>вошёл в защиту от лагов (<white>%ping% ms</white>).'
  cmd-no-permission: '<red>Недостаточно прав.'
  cmd-usage: '<gray>Использование: <white>/pingshield <reload|status|net|check|protect|unprotect|info|profile|perf|cp|search|perms|via> [игрок] [минуты] [радиус]'
  cmd-reloaded: '<green>Конфигурация перезагружена. Порог входа: <white>%enter% ms</white>, выхода: <white>%exit% ms</white>, период: <white>%interval%</white> тик(ов).'
  cmd-player-not-found: '<red>Игрок <white>%player%</white> не найден в сети.'
  cmd-status-header: '<gold>Под защитой: <white>%count%</white> <dark_gray>|</dark_gray> порог <white>%enter%/%exit% ms</white> <dark_gray>|</dark_gray> серверный лаг: <white>%lag%</white>'
  cmd-status-entry: '<gray>• <white>%player%</white> <dark_gray>|</dark_gray> <white>%ping% ms</white> (пик %peak%) <dark_gray>|</dark_gray> %elapsed% с <dark_gray>|</dark_gray> <gray>%reason%</gray>'
  cmd-status-empty: '<gray>Защищённых игроков нет.'
  cmd-manual-protect: '<green>Игрок <white>%player%</white> помещён под защиту вручную (действует до /pingshield unprotect).'
  cmd-manual-unprotect: '<green>С игрока <white>%player%</white> снята защита.'
  cmd-player-not-protected: '<red>Игрок <white>%player%</white> сейчас не под защитой.'
  cmd-check-protected: '<white>%player%</white> <dark_gray>|</dark_gray> пинг: <white>%ping% ms</white> (порог %enter%) <dark_gray>|</dark_gray> под защитой: <red>да</red> <dark_gray>|</dark_gray> %elapsed% с, пик %peak% ms, причина: %reason%'
  cmd-check-clear: '<white>%player%</white> <dark_gray>|</dark_gray> пинг: <white>%ping% ms</white> <dark_gray>|</dark_gray> порог входа %enter% ms, выхода %exit% ms <dark_gray>|</dark_gray> в бою: %combat%, в паузе: %cooldown%'
  cmd-proxy-warning: '<red>Внимание: похоже, сервер работает за прокси (Velocity/Bungee) — getPing() измеряет путь до прокси, а не до игрока. Проверьте proxy.mode.'
  cmd-profile: '<gold>Профиль <white>%player%</white><gray>: пинг <white>%ping% ms</white>, сглаженный <white>%ewma% ms</white>, jitter <white>%jitter% ms</white> <dark_gray>|</dark_gray> порог <white>%enter%/%exit% ms</white> <dark_gray>|</dark_gray> активаций за час: <white>%activations%</white> <dark_gray>|</dark_gray> серии: <white>%above%/%below%</white> <dark_gray>|</dark_gray> бой: %combat%, пауза: %cooldown% <dark_gray>|</dark_gray> статус: %protect%'
