  network-spike-alert: '<gold>[PingShield] <white>Общий сетевой скачок</white> <gray>: медиана пинга <white>%median% ms</white> (норма <white>%baseline% ms</white>, <white>%ratio%x</white>), выше нормы <white>%affected%%</white> игроков. Режим: <white>%mode%</white>%bonus%. Пинг вырос у всех — это похоже на канал/хостера, а не на отдельных игроков.'
